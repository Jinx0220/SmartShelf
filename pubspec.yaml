name: smartshelf
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"  # Fixed: Compatible with your current SDK

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.9
  google_fonts: ^8.1.0
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.3.0
  lottie: ^3.3.3

  # State Management
  provider: ^6.1.5+1

  # Firebase
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  firebase_messaging: ^15.2.0

  # Storage & Preferences
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5

  # Charts & Reports
  fl_chart: ^1.2.0
  csv: ^8.0.0
  share_plus: ^13.1.0
  printing: ^5.14.3

  # Utils
  intl: ^0.20.2
  connectivity_plus: ^7.1.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.2
  timezone: ^0.10.0
  dio: ^5.9.2

  # Notifications
  flutter_local_notifications: ^19.0.0
  permission_handler: ^11.0.0

  # UI Components
  pinput: ^6.0.2
  fluttertoast: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/